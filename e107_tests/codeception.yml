paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/_support
    envs: tests/_envs
actor_suffix: Tester
bootstrap: _bootstrap.php
coverage:
    enabled: true
    include:
        - '%app_path%/*.php'
        - '%app_path%/e107_admin/**/*.php'
        - '%app_path%/e107_core/**/*.php'
        - '%app_path%/e107_handlers/**/*.php'
        - '%app_path%/e107_images/**/*.php'
        - '%app_path%/e107_plugins/**/*.php'
        - '%app_path%/e107_themes/**/*.php'
        - '%app_path%/e107_web/**/*.php'
        - '%app_path%/e107_plugins/linkwords/tests'
    exclude:
        - './**'
        - '%app_path%/e107_handlers/vendor/**/*.php'
        - '%app_path%/e107_tests/**'
        # Generated cache, not source. These are .php files that get included,
        # so coverage records them, and anything that clears a cache mid-run
        # then deletes a file the analyser still means to read. It reports that
        # as "Failed to open stream" and Codeception turns it into a fatal.
        - '%app_path%/e107_system/**'
params:
    - lib/config.php
extensions:
    enabled:
        - Codeception\Extension\RunFailed
modules:
    enabled:
        - Asserts
        - \Helper\DelayedDb:
            dsn: 'mysql:host=%db.host%;port=%db.port%;dbname=%db.dbname%'
            user: '%db.user%'
            password: '%db.password%'
            populate: '%db.populate%'
            dump: '%db.dump_path%'
settings:
    error_level: 28671 # E_ALL & ~E_USER_DEPRECATED

