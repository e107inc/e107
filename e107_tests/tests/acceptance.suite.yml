# Codeception Test Suite Configuration
#
# Suite for acceptance tests.
# Perform tests in browser using the WebDriver or PhpBrowser.
# If you need both WebDriver and PHPBrowser tests - create a separate suite.

actor: AcceptanceTester
shuffle: false
coverage:
    enabled: false
extensions:
    enabled:
        # Sweeps the artifacts an acceptance run writes into the app root, on
        # the way in and on the way out, pass or fail.
        - Extension\WorkspaceCleanup
modules:
    enabled:
        - Asserts
        - PhpBrowser:
            url: '%url%'
        - \Helper\Acceptance:
        - \Helper\AdminLogin:
        - \Helper\ForumFixture:
        - \Helper\MenuPrefFixture:
        - \Helper\ThemeFixture:
