# Codeception Test Suite Configuration
#
# Suite for acceptance tests.
# Perform tests in browser using the WebDriver or PhpBrowser.
# If you need both WebDriver and PHPBrowser tests - create a separate suite.

actor: AcceptanceTester
shuffle: false
coverage:
    enabled: false
extensions:
    enabled:
        # Takes back what each test wrote into its sandbox, and reports a test
        # that left anything else there, which fails the run.
        - Extension\SandboxGuard
modules:
    enabled:
        - Asserts
        - PhpBrowser:
            url: '%url%'
        - \Helper\Acceptance:
        - \Helper\AdminLogin:
        - \Helper\ForumFixture:
        - \Helper\MenuPrefFixture:
        - \Helper\SitelinkFixture:
        - \Helper\ThemeFixture:
        - \Helper\Probe:
        - \Helper\MemberFixture:
