# e107 test harness compose stack: db + web. Driven by the
# e107_tests/bin/e107-tests wrapper, which sets the project name, the matrix
# env vars, and the bind mount; see e107_tests/docker/README.md. Don't run
# `docker compose` against this file directly.

name: ${COMPOSE_PROJECT_NAME:?no active env; drive this file via e107_tests/bin/e107-tests (see docker/README.md)}

# Every container and volume carries these labels. They are the harness's
# only state store: e107-tests rediscovers envs (any worktree) from them.
x-e107-labels: &e107-labels
  e107.tests: "1"
  e107.tests.php: ${E107_PHP_VERSION:-}
  e107.tests.db: ${E107_DB_IMAGE:-}
  e107.tests.app-path: ${E107_APP_PATH:-}
  e107.tests.xdebug: ${E107_WITH_XDEBUG:-no}

services:
  db:
    image: ${E107_DB_IMAGE:-mariadb:10.11}
    restart: unless-stopped
    labels: *e107-labels
    environment:
      MYSQL_ROOT_PASSWORD: ${E107_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${E107_DB_NAME}
      MYSQL_USER: ${E107_DB_USER}
      MYSQL_PASSWORD: ${E107_DB_PASSWORD}
      # MySQL 8+ accepts utf8mb4 fine; e107 sticks with utf8(mb3) historically.
      MYSQL_CHARACTER_SET: ${E107_DB_CHARSET:-utf8mb3}
    # String form so the wrapper can inject flavor-specific args (charset
    # naming and auth plugin differ across mysql/mariadb versions; see
    # db_flavor_args in bin/e107-tests).
    command: >-
      --character-set-server=${E107_DB_CHARSET:-utf8mb3}
      --collation-server=${E107_DB_COLLATION:-utf8mb3_general_ci}
      --max-allowed-packet=64M
      --max-connections=1000
      ${E107_DB_EXTRA_ARGS:-}
    healthcheck:
      # mariadb-admin ships with both mariadb and recent mysql images;
      # mysqladmin is the fallback for older mysql tags.
      test:
        - CMD-SHELL
        - >-
          mariadb-admin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD"
          --silent 2>/dev/null
          || mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD"
          --silent
      interval: 5s
      timeout: 5s
      retries: 30
    tmpfs:
      # Ephemeral DB: faster, and `down` is a clean reset.
      - /var/lib/mysql
    ports:
      # Expose so agents/humans can connect a MySQL client from the host.
      - "127.0.0.1::3306"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${E107_PHP_VERSION:-8.2}
        WITH_XDEBUG: ${E107_WITH_XDEBUG:-no}
    image: ${E107_WEB_IMAGE:?drive this file via e107_tests/bin/e107-tests}
    restart: unless-stopped
    labels: *e107-labels
    depends_on:
      db:
        condition: service_healthy
    # The suite runner mounts a kernel overlay per worker over the worktree
    # (lib/sandbox). Mounting needs CAP_SYS_ADMIN, and Docker's default AppArmor
    # profile denies mount outright; rootless podman has no AppArmor to lift.
    cap_add: [SYS_ADMIN]
    security_opt: [apparmor=unconfined]
    # Each request opens its own database connections, and sixteen sandboxes
    # close them faster than TIME_WAIT gives their ports back; a new connection
    # may take over a port still in TIME_WAIT.
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
    networks:
      default:
        # Two names per sandbox, which Apache serves from that sandbox's overlay:
        # the suite's, and a bare one for a test that needs the same site
        # under a host it was not told about. The runner counts these; the
        # certificate and the session directories (Dockerfile) are sized for
        # sixteen.
        aliases: [sb1.web, sb2.web, sb3.web, sb4.web, sb5.web, sb6.web, sb7.web, sb8.web,
                  sb9.web, sb10.web, sb11.web, sb12.web, sb13.web, sb14.web, sb15.web, sb16.web,
                  sb1, sb2, sb3, sb4, sb5, sb6, sb7, sb8, sb9, sb10, sb11, sb12, sb13, sb14, sb15, sb16]
    environment:
      E107_DB_HOST: db
      E107_DB_PORT: "3306"
      E107_DB_USER: ${E107_DB_USER}
      E107_DB_PASSWORD: ${E107_DB_PASSWORD}
      E107_DB_NAME: ${E107_DB_NAME}
      # For the suite runner, which clones each sandbox's database as root.
      E107_DB_ROOT_PASSWORD: ${E107_DB_ROOT_PASSWORD}
      # Empty for a docroot install; a bare directory name (no slashes) to
      # also serve the site from a subdirectory. The entrypoint turns this
      # into an Apache alias. See bin/e107-tests --base-path.
      E107_BASE_PATH: ${E107_BASE_PATH:-}
    volumes:
      # Bind-mount the app root so host edits are live. The suites never write
      # to it: each run's sandboxes overlay it. `up --install-site` does, and
      # `e107-tests clean` removes what that leaves.
      - ${E107_APP_PATH}:/var/www/html
      # Per-env vendor tree, shadowing the (untouched) worktree vendor dir so
      # every env resolves its own dependencies for its own PHP version.
      - vendor:/var/www/html/e107_tests/vendor
      # Composer's download cache, kept across `down`/`up` cycles. A named
      # volume unless E107_COMPOSER_CACHE names a host directory to bind
      # instead, which is how CI keeps it between runs.
      - ${E107_COMPOSER_CACHE:-composer-cache}:/root/.composer/cache
    ports:
      - "127.0.0.1:${E107_WEB_PORT:-0}:80"


volumes:
  vendor:
    labels: *e107-labels
  composer-cache:
    labels: *e107-labels
