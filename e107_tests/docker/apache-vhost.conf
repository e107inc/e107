<VirtualHost *:80>
    ServerName e107.test
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# The same site over TLS. The outbound request policy verifies the TLS peer
# unconditionally, and a test about that needs a peer it can verify served from
# somewhere the container can reach. See the Dockerfile.
<VirtualHost *:443>
    ServerName web
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/ssl/e107/web.crt
    SSLCertificateKeyFile /etc/ssl/e107/web.key

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
