# The worktree, and a sandbox per suite worker: sbN.web, and sbN alone, are
# served from /srv/sb/sbN, where the suite runner mounts that worker's overlay of the
# worktree (lib/sandbox). The runner replaces the overlay between tests, so a
# fresh sandbox needs a mount and no reload. A --base-path subdirectory is
# served through a link the entrypoint makes under /srv/base-path.
<Directory /var/www/html>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory /srv>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
Include /etc/apache2/e107-sandbox-sessions.conf

# While a run's network boundary is up (lib/sandbox/Boundary.php), Apache serves
# the sandboxes alone: a request for anything else, the worktree's own site
# above all, is refused and written down, and the run fails the test behind it.
<If "-f '${E107_BOUNDARY_UP}' && %{REQUEST_FILENAME} !~ m#^/srv/sb/#">
    Require all denied
    ErrorDocument 403 "Refused by the e107 test harness: during a run, a test reaches its site at its sandbox's name alone (see e107_tests/docker/README.md)"
    SetEnvIfExpr true e107_refused
</If>
GlobalLog ${E107_REFUSED_LOG} "%{sec}t.%{usec_frac}t\t%a\t%p\t%{Host}i\t%m %U%q" env=e107_refused

<FilesMatch \.php$>
    SetHandler application/x-httpd-php
</FilesMatch>

<VirtualHost *:80>
    ServerName e107.test
    DocumentRoot /var/www/html
    IncludeOptional /etc/apache2/e107-base-path.conf
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName sb.web
    ServerAlias sb*
    VirtualDocumentRoot /srv/sb/%1
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# The same sites over TLS. A browser only sends the Sec-Fetch-* headers to a
# potentially trustworthy origin, so these are the only vhosts on which e107's
# browser-only CSRF modes can be exercised at all. See the Dockerfile.
<VirtualHost *:443>
    ServerName web
    DocumentRoot /var/www/html
    IncludeOptional /etc/apache2/e107-base-path.conf
    SSLEngine on
    SSLCertificateFile    /etc/ssl/e107/web.crt
    SSLCertificateKeyFile /etc/ssl/e107/web.key
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName sb.web
    ServerAlias sb*
    VirtualDocumentRoot /srv/sb/%1
    SSLEngine on
    SSLCertificateFile    /etc/ssl/e107/web.crt
    SSLCertificateKeyFile /etc/ssl/e107/web.key
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
