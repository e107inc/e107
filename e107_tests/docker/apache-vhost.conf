# The worktree, and a sandbox per suite worker: sbN.web, and sbN alone, are
# served from /srv/sb/sbN, where the suite runner mounts that worker's overlay of the
# worktree (lib/sandbox). The runner replaces the overlay between tests, so a
# fresh sandbox needs a mount and no reload.
<Directory /var/www/html>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory /srv/sb>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
Include /etc/apache2/e107-sandbox-sessions.conf

<FilesMatch \.php$>
    SetHandler application/x-httpd-php
</FilesMatch>

<VirtualHost *:80>
    ServerName e107.test
    DocumentRoot /var/www/html
    IncludeOptional /etc/apache2/e107-base-path.conf
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName sb.web
    ServerAlias sb*
    VirtualDocumentRoot /srv/sb/%1
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# The same sites over TLS. A browser only sends the Sec-Fetch-* headers to a
# potentially trustworthy origin, so these are the only vhosts on which e107's
# browser-only CSRF modes can be exercised at all. See the Dockerfile.
<VirtualHost *:443>
    ServerName web
    DocumentRoot /var/www/html
    IncludeOptional /etc/apache2/e107-base-path.conf
    SSLEngine on
    SSLCertificateFile    /etc/ssl/e107/web.crt
    SSLCertificateKeyFile /etc/ssl/e107/web.key
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName sb.web
    ServerAlias sb*
    VirtualDocumentRoot /srv/sb/%1
    SSLEngine on
    SSLCertificateFile    /etc/ssl/e107/web.crt
    SSLCertificateKeyFile /etc/ssl/e107/web.key
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
