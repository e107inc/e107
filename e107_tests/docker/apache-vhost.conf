<VirtualHost *:80>
    ServerName e107.test
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# The same site over TLS. A browser only sends the Sec-Fetch-* headers to a
# potentially trustworthy origin, so this is the only vhost on which e107's
# browser-only CSRF modes can be exercised at all. See the Dockerfile.
<VirtualHost *:443>
    ServerName web
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/ssl/e107/web.crt
    SSLCertificateKeyFile /etc/ssl/e107/web.key

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
