; e107 test harness — PHP overrides
;
; Loose limits so installs, file uploads, and image tests don't trip
; arbitrary ceilings. Errors are surfaced loudly because this is a
; test environment, never production.

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 80M
max_execution_time = 300

display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_USER_DEPRECATED
log_errors = On

date.timezone = UTC

allow_url_fopen = On

; Codeception 4 refuses to start without this ("register_argc_argv must be
; set to On for running Codeception"). The official php images ship no
; php.ini at all, so the built-in default applies, and on PHP 8.5 that is
; Off. Codeception 5 does not check, which is why only this branch noticed.
register_argc_argv = On

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
