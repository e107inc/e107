; e107 test harness — PHP overrides
;
; Loose limits so installs, file uploads, and image tests don't trip
; arbitrary ceilings. Errors are surfaced loudly because this is a
; test environment, never production.

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 80M
max_execution_time = 300

display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_USER_DEPRECATED
log_errors = On

date.timezone = UTC

; php.ini-production's value. The official images ship no php.ini, so without
; this the harness is the one Apache+mod_php host where output before the
; first header() call, such as cron.php's shebang line, sends the headers.
output_buffering = 4096

allow_url_fopen = On

; register_argc_argv deliberately stays at the built-in default (Off) here.
; Codeception 4 refuses to start without it ("register_argc_argv must be set
; to On for running Codeception"), but conf.d applies to every SAPI, and
; turning it on for Apache makes PHP 8.5 derive $_SERVER['argv'] from the
; query string, which it deprecates -- printing a notice above every response
; carrying a query string and failing any assertion on page content. So the
; setting belongs at the codecept invocation (`php -d register_argc_argv=1`
; in e107_tests/bin/e107-tests), which is the only place it is read.

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
