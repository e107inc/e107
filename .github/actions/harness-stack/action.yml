name: Bring up the e107 test harness
description: >-
  Brings up the compose stack e107_tests/bin/e107-tests drives, from caches
  wherever it can: the web image travels between runs as a tarball keyed on
  its inputs and the month, and Composer's download cache is keyed on the
  lock files, so a warm run installs everything without a registry or
  package host answering. Registry images come through mirror.gcr.io with
  Docker Hub behind it, pulled while the web image loads, and every step that
  reaches the network retries with a pause.

inputs:
  php:
    description: PHP version of the web image (the php:<version>-apache tag)
    required: true
  db:
    description: Database image
    required: true
  xdebug:
    description: "'yes' for the coverage-capable image"
    default: 'no'
  up-args:
    description: Further flags for `e107-tests up`, such as --no-selenium
    default: ''

runs:
  using: composite
  steps:
    - name: Pull the registry images
      shell: bash
      run: |
        pulls=$RUNNER_TEMP/e107-pull
        mkdir -p "$pulls"
        images='${{ inputs.db }}'
        case ' ${{ inputs.up-args }} ' in
          *' --no-selenium '*) ;;
          *) images="$images ${E107_SELENIUM_IMAGE:-}" ;;
        esac
        for img in $images; do
          f=$pulls/$(printf '%s' "$img" | tr -c 'A-Za-z0-9' '-')
          echo "$f" >> "$pulls/list"
          exec 9> "$f.lock"
          flock 9
          setsid nohup bash -c '"$0" "$1" > "$2.log" 2>&1; echo $? > "$2.rc"' \
            "$GITHUB_ACTION_PATH/pull.sh" "$img" "$f" < /dev/null > /dev/null 2>&1 &
          exec 9>&-
        done

    - name: Image cache key
      id: key
      shell: bash
      run: |
        tag=$(./e107_tests/bin/e107-tests image --php '${{ inputs.php }}' ${{ inputs.xdebug == 'yes' && '--xdebug' || '' }})
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

    - name: Restore the web image
      id: web
      uses: actions/cache@v5
      with:
        path: /tmp/e107-web.tar
        key: web-image-${{ steps.key.outputs.tag }}-${{ steps.key.outputs.month }}

    - name: Build the web image
      if: steps.web.outputs.cache-hit != 'true'
      shell: bash
      run: |
        . "$GITHUB_ACTION_PATH/retry.sh"
        "$GITHUB_ACTION_PATH/pull.sh" 'docker.io/library/php:${{ inputs.php }}-apache'
        retry docker build \
          --build-arg 'PHP_VERSION=${{ inputs.php }}' \
          --build-arg 'WITH_XDEBUG=${{ inputs.xdebug }}' \
          -t '${{ steps.key.outputs.tag }}' e107_tests/docker
        docker save '${{ steps.key.outputs.tag }}' -o /tmp/e107-web.tar

    - name: Load the web image
      if: steps.web.outputs.cache-hit == 'true'
      shell: bash
      run: docker load -i /tmp/e107-web.tar

    - name: Restore the composer cache
      uses: actions/cache@v5
      with:
        path: /tmp/e107-composer-cache
        key: composer-${{ inputs.php }}-${{ hashFiles('e107_tests/composer.lock', 'e107_tests/composer.php*.lock') }}
        restore-keys: composer-${{ inputs.php }}-

    - name: Wait for the registry images
      shell: bash
      run: |
        while read -r f; do
          flock "$f.lock" true
          if [ "$(cat "$f.rc" 2>/dev/null)" != 0 ]; then
            echo "::warning::$(basename -- "$f"): pull failed; e107-tests up will try again"
            cat "$f.log" 2>/dev/null || true
          fi
        done < "$RUNNER_TEMP/e107-pull/list"

    - name: Bring up the stack
      shell: bash
      env:
        E107_COMPOSER_CACHE: /tmp/e107-composer-cache
      run: |
        . "$GITHUB_ACTION_PATH/retry.sh"
        retry ./e107_tests/bin/e107-tests up \
          --php '${{ inputs.php }}' \
          --db '${{ inputs.db }}' \
          ${{ inputs.xdebug == 'yes' && '--xdebug' || '' }} \
          ${{ inputs.up-args }}
