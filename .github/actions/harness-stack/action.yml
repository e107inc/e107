name: Bring up the e107 test harness
description: >-
  Brings up the compose stack e107_tests/bin/e107-tests drives, from caches
  wherever it can: the web image travels between runs as a tarball keyed on
  its inputs and the month, and Composer's download cache is keyed on the
  lock files, so a warm run installs everything without a registry or
  package host answering. Registry images come through mirror.gcr.io with
  Docker Hub behind it, pulled while the web image loads, as the browser image
  is built, and every step that reaches the network retries with a pause. It
  brings up one env per cell, all at once (see cells.sh).

inputs:
  php:
    description: PHP version of the web image (the php:<version>-apache tag)
    required: true
  db:
    description: Database image, for every cell that does not name its own
    default: ''
  cells:
    description: >-
      One env per line, `[name] [up flags...] [-- run flags...]`.
      `cells.sh run` runs a command in every one.
    required: true
  xdebug:
    description: "'yes' for the coverage-capable image"
    default: 'no'
  up-args:
    description: Further flags for `e107-tests up`, such as --no-selenium
    default: ''

runs:
  using: composite
  steps:
    - name: Plan the envs and fetch their images
      shell: bash
      env:
        CELLS: ${{ inputs.cells }}
        DB: ${{ inputs.db }}
      run: |
        "$GITHUB_ACTION_PATH/cells.sh" plan --php '${{ inputs.php }}' ${DB:+--db "$DB"} \
          ${{ inputs.xdebug == 'yes' && '--xdebug' || '' }} ${{ inputs.up-args }} <<< "$CELLS"
        pulls=$RUNNER_TEMP/e107-pull
        mkdir -p "$pulls"
        n=0
        bg() {
          n=$((n + 1))
          local f=$pulls/$n
          printf '%s\t%s\n' "$f" "$1" >> "$pulls/list"
          shift
          exec 9> "$f.lock"
          flock 9
          setsid nohup bash -c '"${@:2}" > "$1.log" 2>&1; echo $? > "$1.rc"' bash "$f" "$@" \
            < /dev/null > /dev/null 2>&1 &
          exec 9>&-
        }
        for img in $("$GITHUB_ACTION_PATH/cells.sh" images); do
          bg "$img" "$GITHUB_ACTION_PATH/pull.sh" "$img"
        done
        case ' ${{ inputs.up-args }} ' in
          *' --no-selenium '*) ;;
          *) dockerfile=e107_tests/docker/browser.Dockerfile
             browser=$(e107_tests/bin/e107-tests image --browser)
             bg "$browser" sh -c '"$0" "$1" && docker build -q -t "$3" -f "$2" e107_tests/docker' \
               "$GITHUB_ACTION_PATH/pull.sh" "$(sed -n 's/^FROM //p' "$dockerfile")" "$dockerfile" "$browser" ;;
        esac

    - name: Image cache key
      id: key
      shell: bash
      run: |
        tag=$(./e107_tests/bin/e107-tests image --php '${{ inputs.php }}' ${{ inputs.xdebug == 'yes' && '--xdebug' || '' }})
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

    - name: Restore the web image
      id: web
      uses: actions/cache/restore@v5
      with:
        path: /tmp/e107-web.tar
        key: web-image-${{ steps.key.outputs.tag }}-${{ steps.key.outputs.month }}

    - name: Build the web image
      if: steps.web.outputs.cache-hit != 'true'
      shell: bash
      run: |
        . "$GITHUB_ACTION_PATH/retry.sh"
        "$GITHUB_ACTION_PATH/pull.sh" 'docker.io/library/php:${{ inputs.php }}-apache'
        retry docker build \
          --build-arg 'PHP_VERSION=${{ inputs.php }}' \
          --build-arg 'WITH_XDEBUG=${{ inputs.xdebug }}' \
          -t '${{ steps.key.outputs.tag }}' e107_tests/docker
        docker save '${{ steps.key.outputs.tag }}' -o /tmp/e107-web.tar

    - name: Save the web image
      if: steps.web.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: /tmp/e107-web.tar
        key: ${{ steps.web.outputs.cache-primary-key }}

    - name: Load the web image
      if: steps.web.outputs.cache-hit == 'true'
      shell: bash
      run: docker load -i /tmp/e107-web.tar

    - name: Restore the composer cache
      id: composer
      uses: actions/cache/restore@v5
      with:
        path: /tmp/e107-composer-cache
        key: composer-${{ inputs.php }}-${{ hashFiles('e107_tests/composer.lock', 'e107_tests/composer.php*.lock') }}
        restore-keys: composer-${{ inputs.php }}-

    - name: Wait for the images
      shell: bash
      run: |
        while IFS=$'\t' read -r f img; do
          flock "$f.lock" true
          if [ "$(cat "$f.rc" 2>/dev/null)" != 0 ]; then
            echo "::warning::$img: failed in the background; e107-tests up will try again"
            cat "$f.log" 2>/dev/null || true
          fi
        done < "$RUNNER_TEMP/e107-pull/list"

    - name: Bring up the stack
      shell: bash
      env:
        E107_COMPOSER_CACHE: /tmp/e107-composer-cache
      run: '"$GITHUB_ACTION_PATH/cells.sh" up'

    - name: Save the composer cache
      if: steps.composer.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: /tmp/e107-composer-cache
        key: ${{ steps.composer.outputs.cache-primary-key }}
