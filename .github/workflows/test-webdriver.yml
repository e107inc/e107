name: WebDriver Tests

on:
  push:
  pull_request:

jobs:
  test-webdriver:
    strategy:
      fail-fast: false
      matrix:
        # One job for now. Add entries to fan out: each dimension is just a tag
        # the compose stack already parameterises (E107_PHP_VERSION /
        # E107_DB_IMAGE / E107_SELENIUM_IMAGE), so a matrix of PHP, database,
        # and Chromium versions is a matter of listing them here.
        include:
          - php-version: '8.5'
            db-image: 'mariadb:10.11'
            selenium-image: 'docker.io/selenium/standalone-chrome:latest'

    runs-on: ubuntu-latest

    env:
      E107_SELENIUM_IMAGE: ${{ matrix.selenium-image }}

    steps:
      - uses: actions/checkout@v6

      - name: Bring up the stack
        uses: ./.github/actions/harness-stack
        with:
          php: ${{ matrix.php-version }}
          db: ${{ matrix.db-image }}

      # Both schemes. A browser sends the Sec-Fetch-* headers only to a
      # potentially trustworthy origin, so e107's browser-only CSRF modes exist
      # over HTTPS and soften to a token over plain HTTP. Running one scheme
      # would leave half of that untested, and it was the untested half that
      # locked every plain-HTTP site out. See tests/webdriver.suite.yml.
      - name: Run WebDriver tests over HTTP
        run: e107_tests/bin/e107-tests run webdriver --env http

      - name: Run WebDriver tests over HTTPS
        run: e107_tests/bin/e107-tests run webdriver --env tls

      - name: Upload Codeception output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webdriver-output-${{ matrix.php-version }}
          path: e107_tests/tests/_output/
          if-no-files-found: ignore

      - name: Container logs on failure
        if: failure()
        run: timeout 20 e107_tests/bin/e107-tests logs || true
