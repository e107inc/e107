name: Acceptance Tests

on:
  push:
    branches: [master, 'release/**']
  pull_request:

# A newer push to a branch or pull request cancels the run it supersedes.
# master is the exception: every merge commit there gets its full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# The acceptance suite runs on the same harness developers use locally
# (e107_tests/bin/e107-tests), so a CI failure reproduces with two commands:
#
#   e107_tests/bin/e107-tests up --php 5.6 --db mysql:5.5
#   e107_tests/bin/e107-tests run acceptance
#
# Add --base-path e107 for the subdirectory layout. That flag is not
# decoration: e107 derives e_HTTP from the request and scopes cookies,
# redirects and generated links to it, so a site under a subdirectory reaches
# code a docroot install never does, and most e107 sites are installed that way.
#
# Each job runs both layouts at once, one env each on the same runner, each in
# its own copy of the tree (see .github/actions/harness-stack/cells.sh). A
# failed layout is named, as "PHP 8.5, mariadb:12.3, subdirectory", in an
# annotation and in the job summary, and its output is the log group of that
# name in the step that failed.
#
# The matrix is the ends of the supported range rather than every point in it.
# A version break is nearly always "too old to have it" or "too new to still
# have it"; the middle of the range rarely disagrees with both ends.

jobs:
  test-acceptance:
    name: PHP ${{ matrix.php }}, ${{ matrix.db }}
    strategy:
      fail-fast: false
      matrix:
        # Spelled out rather than built from axes: the entries are easier to
        # read, and to add one to, than the rules for how `include` merges.
        # Old PHP is paired with old MySQL and new with new, which is how
        # these are actually deployed.
        #
        # Every cell here was run before it was written down. The ceiling was
        # 8.2 because e107 named E_STRICT while building its debug handler,
        # which PHP 8.4 deprecates and which happens before class2.php
        # narrows error_reporting: display_errors is on in this harness, so
        # two notices arrived at the top of every response and twelve tests
        # reading page content broke on them. Fixing that one file is enough
        # to make all 439 pass on 8.5, in both layouts.
        #
        # Both layouts are tested because e107 derives e_HTTP from the
        # request and scopes its session cookie, its redirects and every
        # generated link to it. The job this replaced only ever tested the
        # subdirectory shape, so the docroot layout is new coverage and the
        # subdirectory layout is what CI has always had.
        include:
          - php: '5.6'
            db: 'mysql:5.5'
          - php: '8.5'
            db: 'mariadb:12.3'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Bring up one stack per layout
        uses: ./.github/actions/harness-stack
        with:
          php: ${{ matrix.php }}
          db: ${{ matrix.db }}
          cells: |
            docroot
            subdirectory --base-path e107

      # !cancelled(): a layout whose env did not come up is reported as a
      # failed cell, and the other still runs.
      - name: Run acceptance tests in both layouts
        if: ${{ !cancelled() }}
        run: .github/actions/harness-stack/cells.sh run run acceptance

      - name: Keep the failed cells' output
        if: failure()
        uses: ./.github/actions/harness-stack/failed-cells
        with:
          name: acceptance-php${{ matrix.php }}
