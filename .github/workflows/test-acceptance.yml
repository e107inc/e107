name: Acceptance Tests

on:
  push:
  pull_request:

# The acceptance suite runs on the same harness developers use locally
# (e107_tests/bin/e107-tests), so a CI failure reproduces with two commands:
#
#   e107_tests/bin/e107-tests up --php 8.5 --db mariadb:12.3 --no-selenium
#   e107_tests/bin/e107-tests run acceptance
#
# Add --base-path e107 for the subdirectory legs. That flag is not decoration:
# e107 derives e_HTTP from the request and scopes cookies, redirects and
# generated links to it, so a site under a subdirectory reaches code a docroot
# install never does, and most e107 sites are installed that way.
#
# The matrix is the ends of the supported range rather than every point in it.
# A version break is nearly always "too old to have it" or "too new to still
# have it"; the middle of the range rarely disagrees with both ends.

jobs:
  test-acceptance:
    name: PHP ${{ matrix.php }}, ${{ matrix.db }}, ${{ matrix.layout }}
    strategy:
      fail-fast: false
      matrix:
        # Spelled out rather than built from axes: four entries are easier to
        # read, and to add one to, than the rules for how `include` merges.
        # Old PHP is paired with old MySQL and new with new, which is how
        # these are actually deployed.
        #
        # The PHP floor is 8.1, not composer.json's declared 8.0, because the
        # test suite cannot be installed on 8.0: every twig release that
        # supports 8.0 is blocked by composer's security-advisory policy, and
        # the only unaffected releases require 8.1. Testing on 8.0 would mean
        # shipping CI a dependency with published vulnerabilities. e107 itself
        # may well still run on 8.0 -- nothing here says otherwise -- but CI
        # cannot demonstrate it, so treat ">=8.0" as unverified.
        #
        # The MySQL floor is 5.7 because the installer cannot create the
        # schema on anything older, which this job is the only thing that
        # checks: the unit suite loads a dump and never runs CREATE TABLE.
        #   mysql:5.5  error 1214, InnoDB had no FULLTEXT index before 5.6
        #   mysql:5.6  error 1071, "key was too long; max key length is 767
        #              bytes" -- the InnoDB COMPACT row format limit that 5.7
        #              relaxes by default
        # release/v2.3.x still installs on 5.5, so this is drift since 2.3 and
        # not a property of e107 generally.
        include:
          - php: '8.1'
            db: 'mysql:5.7'
            layout: docroot
            base_path: ''
          - php: '8.1'
            db: 'mysql:5.7'
            layout: subdirectory
            base_path: 'e107'
          - php: '8.5'
            db: 'mariadb:12.3'
            layout: docroot
            base_path: ''
          - php: '8.5'
            db: 'mariadb:12.3'
            layout: subdirectory
            base_path: 'e107'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      # Built here rather than by `compose up` so the layers survive between
      # runs. compose builds the web image only when it is missing, so loading
      # it under the tag compose expects turns that build into a no-op.
      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: ./e107_tests/docker
          build-args: PHP_VERSION=${{ matrix.php }}
          tags: e107-web:${{ matrix.php }}
          load: true
          cache-from: type=gha,scope=web-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.php }}

      # --no-selenium: the browser image is over a gigabyte and only the
      # WebDriver suite needs it. An empty --base-path means a docroot install.
      - name: Bring up the stack
        run: |
          ./e107_tests/bin/e107-tests up \
            --php '${{ matrix.php }}' \
            --db '${{ matrix.db }}' \
            --base-path '${{ matrix.base_path }}' \
            --no-selenium

      - name: Run acceptance tests
        run: ./e107_tests/bin/e107-tests run acceptance

      - name: Collect container logs
        if: failure()
        run: ./e107_tests/bin/e107-tests logs > /tmp/container.log 2>&1 || true

      - name: Upload failure output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-php${{ matrix.php }}-${{ matrix.layout }}
          path: |
            e107_tests/tests/_output/
            /tmp/container.log
          if-no-files-found: ignore
          retention-days: 7
