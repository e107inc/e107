name: Unit Tests

on:
  push:
  pull_request:

# The unit suite runs on the same harness developers use locally
# (e107_tests/bin/e107-tests), so a CI failure reproduces with two commands:
#
#   e107_tests/bin/e107-tests up --php 5.6 --db mysql:5.5 --xdebug --no-selenium
#   e107_tests/bin/e107-tests ci-unit
#
# `ci-unit` exists to replay this job exactly, coverage flags and all, so base
# image drift such as a changed default memory_limit reproduces on demand.
#
# The harness image is also better equipped than the container it replaces,
# which turns nine skipped tests back into running ones: it ships ImageMagick,
# so the six resize_handler cases asserting that a shell metacharacter in a
# destination filename is not executed actually execute, and it serves its own
# HTTPS vhost with a certificate at /etc/ssl/e107/web.crt, so the three
# e_fileOutboundRequest TLS peer-verification cases do too. The tenth skip,
# opt-in CDN fixture regeneration, is correct and stays.

env:
  CC_TEST_REPORTER_ID: 8948074581c1ffe7f4e47995c65d7d303882310256edd73536723d7c92adb1e3

jobs:
  test-unit:
    name: PHP ${{ matrix.php }}, ${{ matrix.db }}
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.0', '7.4', '8.1', '8.2']
        db: ['mysql:5.5', 'mysql:8.0', 'mariadb:10.0', 'mariadb:10.6', 'mariadb:10.11']

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      # Built here rather than by `compose up` so the layers survive between
      # runs. compose builds the web image only when it is missing, so loading
      # it under the tag compose expects turns that build into a no-op. The
      # xdebug variant carries its own tag and cache scope; coverage needs it.
      #
      # php:5.6 and php:7.0 are Debian Stretch and take the longest to build:
      # their apt repositories have moved to archive.debian.org and gd and
      # xdebug are compiled from source. The cache is what keeps that off the
      # critical path on every run after the first.
      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: ./e107_tests/docker
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            WITH_XDEBUG=yes
          tags: e107-web:${{ matrix.php }}-xdebug
          load: true
          cache-from: type=gha,scope=web-xdebug-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=web-xdebug-${{ matrix.php }}

      # No --install-site: the unit suite loads a dump and never runs the
      # installer. --no-selenium because this branch has no WebDriver suite and
      # the browser image is over a gigabyte.
      #
      # PHP 5.6 and 7.0 can be pointed at mysql:8.0 here, which the previous
      # workflow had to exclude. GitHub Actions service containers take no
      # command arguments, so 8.0 came up on utf8mb4 and caching_sha2_password,
      # neither of which those clients understand. The harness runs the database
      # through compose, where db_flavor_args sets utf8mb3 and
      # mysql_native_password for exactly this reason.
      - name: Bring up the stack
        run: |
          ./e107_tests/bin/e107-tests up \
            --php '${{ matrix.php }}' \
            --db '${{ matrix.db }}' \
            --xdebug \
            --no-selenium

      - name: Download Code Climate test reporter
        run: |
          curl -L https://codeclimate.com/downloads/test-reporter/test-reporter-latest-linux-amd64 > ./cc-test-reporter
          chmod +x ./cc-test-reporter
        working-directory: ./e107_tests/vendor/bin/
        continue-on-error: true

      - name: Code Climate report before build
        run: ./e107_tests/vendor/bin/cc-test-reporter before-build
        continue-on-error: true

      - name: Run unit tests with coverage
        run: ./e107_tests/bin/e107-tests ci-unit

      # The worktree is bind-mounted into the container, so coverage.xml written
      # inside it is already here on the runner.
      - name: Send code coverage report to Code Climate
        run: |
          ./e107_tests/vendor/bin/cc-test-reporter format-coverage \
            --input-type clover \
            --output ./e107_tests/tests/_output/coverage/codeclimate.json \
            ./e107_tests/tests/_output/coverage.xml
          ./e107_tests/vendor/bin/cc-test-reporter upload-coverage \
            --input ./e107_tests/tests/_output/coverage/codeclimate.json
        continue-on-error: true

      - name: Collect container logs
        if: failure()
        run: ./e107_tests/bin/e107-tests logs > /tmp/container.log 2>&1 || true

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-php${{ matrix.php }}-${{ strategy.job-index }}
          path: |
            e107_tests/tests/_output/
            /tmp/container.log
          if-no-files-found: ignore
          retention-days: 7
