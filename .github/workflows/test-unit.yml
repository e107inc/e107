name: Unit Tests

on:
  push:
    branches: [master, 'release/**']
  pull_request:

# A newer push to a branch or pull request cancels the run it supersedes.
# master is the exception: every merge commit there gets its full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# The unit suite runs on the same harness developers use locally
# (e107_tests/bin/e107-tests), so a CI failure reproduces with two commands:
#
#   e107_tests/bin/e107-tests up --php 8.4 --db mariadb:10.11 --no-selenium
#   e107_tests/bin/e107-tests ci-unit
#
# `ci-unit` exists to replay this job exactly, so base image drift such as a
# changed default memory_limit reproduces on demand.
#
# The legacy cells hand it two --skip-group flags (see the step for why), and a
# repro of one of those has to hand it the same ones or it runs a different
# suite from the one that failed:
#
#   e107_tests/bin/e107-tests up --php 5.6 --db mysql:5.5 --no-selenium
#   e107_tests/bin/e107-tests ci-unit --skip-group runs-in-separate-process --skip-group requires-modern-php
#
# The harness image carries what this suite needs to stop skipping tests: it
# ships ImageMagick, so the resize_handler cases that assert a shell
# metacharacter in a destination filename is not executed actually run, and it
# serves its own HTTPS vhost with a certificate at /etc/ssl/e107/web.crt, so the
# e_fileOutboundRequest TLS peer-verification cases do too. Nine tests that the
# hand-built container skipped are real coverage again.
#
# No coverage is measured here. Nothing has consumed it since the Code Climate
# reporter went, and collecting it under Xdebug multiplied the run by three on
# PHP 8.5, by seven on 7.0 and by nine on 5.6, before the Clover report added
# its own minutes on top. `e107-tests run unit --coverage` on an env brought up
# with `up --xdebug` still measures it on demand.

jobs:
  test-unit:
    name: PHP ${{ matrix.php }}, ${{ matrix.db }}
    strategy:
      fail-fast: false
      matrix:
        # 5.6 and 7.0 are here because they are what e107 v2 claims to support,
        # and a claim nothing exercises is a guess. Their images build from the
        # Debian archive, which the Dockerfile already handles for `graft`.
        # 7.4 closes the gap between them and 8.1: the last of the 7 line, and
        # the one cell where composer resolves Codeception 4 with PHPUnit 9,
        # a generation the 5.7 and 10 cells on either side never exercise.
        php: ['5.6', '7.0', '7.4', '8.1', '8.2', '8.3', '8.4', '8.5']
        # mysql:5.5 and mariadb:10.0 are here because e107 can be installed on
        # them again: db_verify now settles a table's storage engine and
        # character set against what the server can actually do, so the tables
        # declaring a FULLTEXT index land on an engine that has one, and an
        # index too wide for a 767-byte limit at utf8mb4 gets utf8 instead.
        db: ['mysql:5.5', 'mysql:8.0', 'mariadb:10.0', 'mariadb:10.6', 'mariadb:10.11']

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # No --install-site: the unit suite loads a dump and never runs the
      # installer. --no-selenium because the browser image is over a gigabyte
      # and only the WebDriver suite needs it.
      - name: Bring up the stack
        uses: ./.github/actions/harness-stack
        with:
          php: ${{ matrix.php }}
          db: ${{ matrix.db }}
          up-args: --no-selenium

      # Two groups come off on 5.6, 7.0 and 7.4. Neither is a hole in e107's
      # support for those runtimes; both are the test tooling failing to reach
      # the code under test.
      #
      # runs-in-separate-process: Codeception 4 is what composer can install on
      # these versions, and there a @runInSeparateProcess case is re-bootstrapped
      # by PHPUnit in a child process that never loads the project autoloader, so
      # it dies on a missing class before any e107 code runs.
      #
      # requires-modern-php: cases that load dev tooling requiring PHP 8.1, which
      # an older runtime cannot even parse.
      - name: Run unit tests
        run: |
          set --
          case '${{ matrix.php }}' in
            5.6|7.0|7.1|7.2|7.3|7.4) set -- --skip-group runs-in-separate-process \
                                            --skip-group requires-modern-php ;;
          esac
          ./e107_tests/bin/e107-tests ci-unit "$@"

      - name: Collect container logs
        if: failure()
        run: ./e107_tests/bin/e107-tests logs > /tmp/container.log 2>&1 || true

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-php${{ matrix.php }}-${{ strategy.job-index }}
          path: |
            e107_tests/tests/_output/
            /tmp/container.log
          if-no-files-found: ignore
          retention-days: 7

  sqli-gate:
    name: SQL-injection static gate
    runs-on: ubuntu-latest
    container:
      image: php:8.3-cli
    steps:
    - name: Install operating system dependencies
      run: apt-get update && apt-get install -y git unzip

    - uses: actions/checkout@v6

    - name: Opt out of CVE-2022-24765 mitigation
      run: git config --global safe.directory '*'

    - name: Install Composer
      run: curl -sSL https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin/ --filename=composer

    - name: Install scanner dependencies
      run: composer install --prefer-dist --no-progress
      working-directory: ./e107_tests/_tools/

    # Fail the build on any NET-NEW unsafe SQL concatenation. The reviewed,
    # documented residue (foreign-schema importers, vouched whole-query executes,
    # fail-closed dynamic-identifier DDL) is frozen in deferral_baseline.json;
    # regenerate it with `--write-baseline=...` only when a site is deliberately
    # migrated or added after review.
    - name: SQL-injection scanner gate
      run: php e107_tests/_tools/sqli_scan.php --quiet --baseline=e107_tests/_tools/deferral_baseline.json
