name: Unit Tests

on:
  push:
    branches: [master, 'release/**']
  pull_request:

# A newer push to a branch or pull request cancels the run it supersedes.
# master is the exception: every merge commit there gets its full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# The unit suite runs on the same harness developers use locally
# (e107_tests/bin/e107-tests), so a CI failure reproduces with two commands:
#
#   e107_tests/bin/e107-tests up --php 5.6 --db mysql:5.5 --no-selenium
#   e107_tests/bin/e107-tests ci-unit
#
# `ci-unit` exists to replay this job exactly, so base image drift such as a
# changed default memory_limit reproduces on demand.
#
# The harness image is also better equipped than the container it replaces,
# which turns nine skipped tests back into running ones: it ships ImageMagick,
# so the six resize_handler cases asserting that a shell metacharacter in a
# destination filename is not executed actually execute, and it serves its own
# HTTPS vhost with a certificate at /etc/ssl/e107/web.crt, so the three
# e_fileOutboundRequest TLS peer-verification cases do too. The tenth skip,
# opt-in CDN fixture regeneration, is correct and stays.
#
# No coverage is measured here. Nothing has consumed it since the Code Climate
# reporter went, and collecting it under Xdebug multiplied the run by three on
# PHP 8.5, by seven on 7.0 and by nine on 5.6, before the Clover report added
# its own minutes on top. `e107-tests run unit --coverage` on an env brought up
# with `up --xdebug` still measures it on demand.

jobs:
  test-unit:
    name: PHP ${{ matrix.php }}, ${{ matrix.db }}
    strategy:
      fail-fast: false
      matrix:
        # The ends of the supported range and two points inside it. 8.5 is
        # the newest PHP an e107 v2.3 site is likely to meet, and 8.0 is the
        # release that turned a long list of PHP's warnings into Errors, so
        # those two are where a version break tends to show. The 8.1 and 8.2
        # cells they replace now sit between two cells that do run.
        php: ['5.6', '7.0', '7.4', '8.0', '8.5']
        db: ['mysql:5.5', 'mysql:8.0', 'mariadb:10.0', 'mariadb:10.6', 'mariadb:10.11']

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # No --install-site: the unit suite loads a dump and never runs the
      # installer. --no-selenium because this branch has no WebDriver suite and
      # the browser image is over a gigabyte.
      #
      # PHP 5.6 and 7.0 can be pointed at mysql:8.0 here, which the previous
      # workflow had to exclude. GitHub Actions service containers take no
      # command arguments, so 8.0 came up on utf8mb4 and caching_sha2_password,
      # neither of which those clients understand. The harness runs the database
      # through compose, where db_flavor_args sets utf8mb3 and
      # mysql_native_password for exactly this reason.
      - name: Bring up the stack
        uses: ./.github/actions/harness-stack
        with:
          php: ${{ matrix.php }}
          db: ${{ matrix.db }}
          up-args: --no-selenium

      - name: Run unit tests
        run: ./e107_tests/bin/e107-tests ci-unit

      - name: Collect container logs
        if: failure()
        run: ./e107_tests/bin/e107-tests logs > /tmp/container.log 2>&1 || true

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-php${{ matrix.php }}-${{ strategy.job-index }}
          path: |
            e107_tests/tests/_output/
            /tmp/container.log
          if-no-files-found: ignore
          retention-days: 7
